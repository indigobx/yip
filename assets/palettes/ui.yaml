# ======================
# ФОН (background layers)
# ======================
- "#100b12"  # Тёмный фон (почти чёрный, «эфир телевизора»)
- "#2a1f2f"  # Средний фон (глубина, панели, подложки)
- "#3c3345"  # Нейтральный фон (активные блоки, окна)
- "#dcd6d0"  # Светлый фон (подсветка панелей, второстепенный фон)

# ================
# ТЕКСТ (typography)
# ================
- "#221926"  # Тёмный текст (на светлом фоне, пассивные подписи)
- "#7a7080"  # Средний текст (основной серый, читаемый)
- "#8c7f8f"  # Выключен (disabled, недоступные элементы)
- "#d5d0db"  # Включён (обычный активный текст, заголовки)
- "#f5ddee"  # Подсвечен (hover, выделение)
- "#ff3a62"  # Активен (клик/ошибка/критичное)

# =======================
# АКЦЕНТЫ (primary colors)
# =======================
- "#660f31"  # Красный тёмный (опасность, фон иконок)
- "#ff546b"  # Красный светлый (ошибки, кнопки «Да/Нет»)
- "#1e579c"  # Голубой тёмный (выбор, выделение)
- "#0ce6f2"  # Голубой светлый (ссылки, hover)
- "#f3f0ea"  # Белый не-чистый (основные заголовки, иконки)

# ============================
# ДОПОЛНИТЕЛЬНЫЕ АКЦЕНТЫ (rare)
# ============================
- "#94d9a5"  # Зелёный бледный (поддержка, успех пассивный)
- "#0fbe4a"  # Зелёный яркий (успех активный, «OK»)
- "#e6e0a8"  # Жёлтый бледный (ожидание, предупреждение пассивное)
- "#ffd85e"  # Жёлтый яркий (важное предупреждение)
- "#b7a1d6"  # Фиолетовый бледный (редкие подсветки, декоративное)
- "#8354d1"  # Фиолетовый яркий (особые элементы, магия/энергия)
